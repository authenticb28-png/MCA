<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../css/style.css"></head><body style="padding:10px">
<div id="o"></div>
<script src="../js/svglib.js"></script>
<script>
const o=document.getElementById('o');
o.innerHTML = S.datapath({path:'lw',title:'lw trace'}) + S.datapath({path:'beq',alt:['pc4_mux'],title:'beq'}) + S.datapath({path:'j',title:'j'})
 + S.kmap({vars:['A','B','C','D'],ones:[0,2,8,10,5,7,13,15],groups:[{cells:[0,2,8,10],label:"B'D'"},{cells:[5,7,13,15],label:'BD'}],title:'4-var'})
 + S.kmap({vars:['A','B','C'],ones:[0,2,3,5],groups:[{cells:[0,2],label:"A'C'"},{cells:[2,3],label:"A'B"},{cells:[5],label:"AB'C"}]})
 + S.timing({signals:[{n:'CLK',w:'0101010101'},{n:'D',w:'0011110001',cls:'wave2'},{n:'Q',w:'0001111000',cls:'wave3'},{n:'BUS',w:'d..d..d...',vals:['A','B','C']}],edges:[1,3,5,7,9]})
 + S.fsm({w:520,h:220,states:[{id:'S0',x:60,y:110,l:'S0',init:'left'},{id:'S1',x:180,y:110,l:'S1'},{id:'S2',x:300,y:110,l:'S2'},{id:'S3',x:420,y:110,l:'S3'}],edges:[{f:'S0',t:'S0',l:'0/0',loop:'top'},{f:'S0',t:'S1',l:'1/0'},{f:'S1',t:'S1',l:'1/0',loop:'top'},{f:'S1',t:'S2',l:'0/0'},{f:'S2',t:'S0',l:'0/0',bend:-0.35},{f:'S2',t:'S3',l:'1/0'},{f:'S3',t:'S1',l:'1/1',bend:0.4,cls:'amber'},{f:'S3',t:'S2',l:'0/0',bend:-0.3}]})
 + S.fields([{n:'opcode',b:6,v:'000000'},{n:'rs',b:5,v:'01000'},{n:'rt',b:5,v:'01001'},{n:'rd',b:5,v:'01010'},{n:'shamt',b:5,v:'00000'},{n:'funct',b:6,v:'100000',note:'add'}],{title:'R'})
 + S.pipe({rows:[{l:'lw $t0, 0($t1)',c:{1:'IF',2:'ID',3:'EX',4:'MEM',5:'WB'}},{l:'add $t2, $t0, $t3',c:{2:'IF',3:'ID',4:'stall',5:'EX',6:'MEM',7:'WB'}}],fwd:[[0,4,1,5]]});
(function(){const g1=S.gate('AND',60,40),g2=S.gate('OR',60,100),g3=S.gate('XOR',60,160),g4=S.gate('NAND',180,40),g5=S.gate('NOR',180,100),g6=S.gate('XNOR',180,160),g7=S.gate('NOT',300,40);
o.innerHTML+=S.svg(400,200,[g1,g2,g3,g4,g5,g6,g7].map(g=>g.svg).join(''),'gates');})();
</script></body></html>
